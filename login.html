<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Note | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <!-- My All Type of Style Including Icon [font-awesome/6.0.0-beta3/css/all.min.css] in this style.css -->
    <link href="css/style.css" rel="stylesheet">
   <style>
    .form-card{
      min-height: 500px;
      background-color: rgba(240, 248, 255, 0.212);
      padding: 50px;
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70% ;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 5px 10px 0 rgba(0, 3, 49, 0.089),inset 0 5px 50px rgba(0, 0, 0, 0.438);
    }

    /* Card animation */
.form-card{
  animation-duration: .6s;
  animation-fill-mode: both;
}

@keyframes bounceIn {
  0% {opacity:0; transform:scale(.8);}
  60% {opacity:1; transform:scale(1.05);}
  100% {transform:scale(1);}
}

@keyframes bounceOut {
  20% {transform:scale(.9);}
  50%,55% {opacity:1; transform:scale(1.1);}
  100% {opacity:0; transform:scale(.3);}
}

.bounce-in{
  animation-name:bounceIn;
}

.bounce-out{
  animation-name:bounceOut;
}

     /* Style for the loading spinner */
        .spinner-border {
            display: none; /* Hidden initially */
        }
        
        /* Style for spinner within button */
        .spinner-border.spinner-border-sm {
            display: none;
        }
        
        .loading .spinner-border {
            display: inline-block;
        }
        
        .loading .button-text {
            display: none;
        }
   </style>
  </head>
  <body>
      <div class="container-fluid" style="margin-top: 80px;">

     <!-- Code in main.js for Particles -->
     <div class="particles" id="particles"></div>



     <div class="row align-items-center">
     <!-- LEFT SIDE FORM -->
     <div class="col-md-6">

      <div id="loginCard" class="form-card bounce-in">
        <!--<h5 class="card-title text-center ">Log In</h5> -->
        <form id="loginForm" class="mt-4">
            <div class="form-group ">
                <label for="loginEmail">Email address<span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="loginEmail" placeholder="Email address" required>
            </div>
            <div class="form-group ">
                <label for="loginPassword">Password<span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Your Password" required>
            </div>
            <div class="form-group form-check ">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember Me</label>
            </div>
            <div class="text-center d-grid">
                <!-- Login Button with Spinner -->
                <button type="submit" id="loginButton" class="btn button10 shadow tertiary">
                    <span class="button-text">Log In</span>
                    <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
                </button>
                <p class="mt-3 ">Don't have an account? <a href="#" id="showSignup" class="text-info"><b>Signup</b></a>
                <br>    
                <span class="mt-1"><a href="#" id="showForgotPassword" class="text-warning"><b>Forgot Password?</b></a></span>
                </p>
                <p class="text-center " style="font-family: Caveat ;"> Developed by <strong>Subitan Ganguly</strong></p>
            </div>
        </form>
</div>


       <div id="signupCard" class="form-card d-none">
                <h5 class="card-title text-center mb-3">Register</h5>
                <form id="signupForm">
                    <div class="input-group mb-1">
                        <span class="input-group-text  " id="basic-addon1">Name<span class="text-danger">*</span></span>
                        <input type="text" class="form-control" id="SignupName" placeholder="Your Name" required>
                    </div>
                    <div class="input-group mb-1">
                      <span class="input-group-text  " id="basic-addon1">Email<span class="text-danger">*</span></span>
                        <label for="signupEmail"></label>
                        <input type="email" class="form-control" id="signupEmail" placeholder="Email address" required>
                    </div>
                    <div class="input-group mb-1">
                      <span class="input-group-text " id="basic-addon1">Mobile<span class="text-danger">*</span></span>
                        <input type="tel" class="form-control" id="signupMobile" placeholder="Mobile Number" required>
                    </div>
                    
                    <div class="input-group mb-1">
                      <span class="input-group-text  " id="basic-addon1">Password<span class="text-danger">*</span></span>
                        <input type="password" class="form-control" id="signupPassword" placeholder="Your Password" required>
                    </div>
                    <div class="input-group mb-1">
                      <span class="input-group-text " id="basic-addon1">Confirm<span class="text-danger">*</span></span>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your Password" required>
                     </div>
                     
                    <div class="text-center d-grid">
                        <!-- Sign Up Button with Spinner -->
                        <button type="submit" id="signupButton" class="btn button11 mt-2">
                            Sign Up
                            <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
                        </button>
                        <p class="mt-3">Already have an account? <a href="#" id="showLogin" class="text-success"><b>Log In</b></a></p>
                    </div>
                </form>
        </div>

 


    
      <!-- Forgot Password Form (hidden initially) -->
        <div id="forgotPasswordCard" class="form-card d-none">
                <h5 class="card-title text-center">Forgot Password</h5>
                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="resetEmail">Email address<span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="resetEmail" placeholder="Email address" required>
                    </div>
                    <div class="text-center d-grid">
                        <button type="submit" class="btn button6 mt-3">Send Reset Link</button>
                        <p class="mt-3"><a href="#" id="backToLogin" class="button8"><b>Back to Login</b></a></p>
                    </div>
                </form>
        </div>
 
 
</div>


<!-- RIGHT SIDE TEXT -->
<div class="col-md-6 text-center">
<div class="p-5">

<div id="welcome-message" >

<div id="phrases" style="display:none;">
<span>Welcome to Smart Note</span>
<span>Developed by <strong>Subitan Ganguly</strong></span>
</div>

<span id="typed-text" class="fw-bold" style="font-size:25px; letter-spacing: 3px; font-family: Caveat ;"></span>
<span class="typed-cursor" style="font-size:30px;">|</span>

</div>

</div>
</div>

</div>

   </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="js/firebasecnfig.js"></script>
    <script src="js/main.js" type="module" crossorigin="anonymous"></script>



    <script>

        // Auto-fill email and password fields if saved in localStorage
        const rememberedUser = JSON.parse(localStorage.getItem("rememberedUser"));
        if (rememberedUser) {
            document.getElementById("loginEmail").value = rememberedUser.email;
            document.getElementById("loginPassword").value = rememberedUser.password;
            document.getElementById("rememberMe").checked = true;
        }

        // Toggle between login, signup, and forgot password forms
        function showCard(hideId, showId){
    const hideCard = document.getElementById(hideId);
    const showCard = document.getElementById(showId);

    hideCard.classList.remove("bounce-in");
    hideCard.classList.add("bounce-out");

    setTimeout(()=>{
        hideCard.classList.add("d-none");
        hideCard.classList.remove("bounce-out");

        showCard.classList.remove("d-none");
        showCard.classList.add("bounce-in");
    },300);
}

document.getElementById("showSignup").onclick = function(e){
    e.preventDefault();
    showCard("loginCard","signupCard");
}

document.getElementById("showLogin").onclick = function(e){
    e.preventDefault();
    showCard("signupCard","loginCard");
}

document.getElementById("showForgotPassword").onclick = function(e){
    e.preventDefault();
    showCard("loginCard","forgotPasswordCard");
}

document.getElementById("backToLogin").onclick = function(e){
    e.preventDefault();
    showCard("forgotPasswordCard","loginCard");
}

        document.getElementById("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();
    
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const rememberMe = document.getElementById("rememberMe").checked;
    const loginButton = document.getElementById("loginButton");

    // Show loading spinner and disable button
    loginButton.classList.add("loading");
    loginButton.disabled = true;

    const persistence = rememberMe 
        ? firebase.auth.Auth.Persistence.LOCAL 
        : firebase.auth.Auth.Persistence.SESSION;

    firebase.auth()
        .setPersistence(persistence)
        .then(() => {
            // Attempt login with email and password
            return firebase.auth().signInWithEmailAndPassword(email, password);
        })
        .then((userCredential) => {
            const user = userCredential.user;
            const lastLoginDate = new Date().toISOString();

            // Fetch user data from the database
            return firebase.database().ref("users/" + user.uid).once("value")
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        throw new Error("User data not found in the database.");
                    }

                    const userData = snapshot.val();

                    // Update the lastLoginDate in the database
                    return firebase.database().ref("users/" + user.uid).update({
                        lastLoginDate: lastLoginDate
                    }).then(() => userData); // Pass userData for further handling
                });
        })
        .then((userData) => {
    // Save user role and other details in localStorage
    localStorage.setItem("userRole", userData.role); // Save role in localStorage
    localStorage.setItem("userLoggedIn", "true"); // Flag to indicate user is logged in

    // Save user credentials if 'remember me' is checked
    if (rememberMe) {
        localStorage.setItem("rememberedUser", JSON.stringify({ email, password }));
    } else {
        localStorage.removeItem("rememberedUser");
    }

    // Role-based redirection
    if (userData.role === "admin") {
        //alert("Welcome Admin!");
        window.location.href = "index.html"; // Redirect to admin dashboard
    } else {
        //alert("Login successful!");
        window.location.href = "index.html"; // Redirect to user dashboard
    }
})

        .catch((error) => {
            // Detailed error messages based on error codes
            let errorMessage;
            switch (error.code) {
                case "auth/user-not-found":
                    errorMessage = "No user found with this email.";
                    break;
                case "auth/wrong-password":
                    errorMessage = "Incorrect password.";
                    break;
                case "auth/invalid-email":
                    errorMessage = "Invalid email address.";
                    break;
                case "auth/network-request-failed":
                    errorMessage = "Network error. Please try again.";
                    break;
                default:
                    errorMessage = error.message || "An unknown error occurred.";
            }
            alert("INVALID LOGIN CREDENTIALS");
        })
        .finally(() => {
            // Re-enable button and hide loading spinner
            loginButton.classList.remove("loading");
            loginButton.disabled = false;
        });
});


    // Sign up function with Confirm Password check and loading spinner in button
    document.getElementById("signupForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const Name = document.getElementById("SignupName").value;
        const email = document.getElementById("signupEmail").value;
        const mobile = document.getElementById("signupMobile").value;
        const password = document.getElementById("signupPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const signupButton = document.getElementById("signupButton");

        // Check if passwords match
        if (password !== confirmPassword) {
            alert("Passwords do not match. Please try again.");
            return;
        }

        // Show loading spinner and disable button
        signupButton.classList.add("loading");
        signupButton.disabled = true;

        try {
            const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;

            const signUpDate = new Date().toISOString(); // ISO format for date-time

            await firebase.database().ref("users/" + user.uid).set({
            Name: Name,
            email: email,
            mobile: mobile,
            signupDate: signUpDate,
            lastLoginDate: signUpDate,  // Initialize with sign-up date
            role: "user"
         });


            // Set user display name
            await user.updateProfile({
                displayName: `${Name} `
            });

            alert("Sign up successful! You can now log in.");

            // Hide signup card and show login card
            document.getElementById("signupCard").classList.add("d-none");
            document.getElementById("loginCard").classList.remove("d-none");
        } catch (error) {
            console.error("Error during sign up:", error); // Log the error for debugging
            alert("Error: " + error.message);
        } finally {
            // Hide loading spinner and re-enable button
            signupButton.classList.remove("loading");
            signupButton.disabled = false;
        }
    });


        // Forgot password function
        document.getElementById("forgotPasswordForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const email = document.getElementById("resetEmail").value;
            firebase.auth().sendPasswordResetEmail(email)
                .then(() => alert("Password reset link sent!"))
                .catch(() => alert("Error sending password reset link."));
        });

      
    </script>
  </body>
</html>
