<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Note | Records</title>
    <link rel="icon" type="image/png" href="img/logo.png">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     
     <!-- My All Type of Style Including Icon [font-awesome/6.0.0-beta3/css/all.min.css] in this style.css -->
    <link href="css/style.css" rel="stylesheet">
    


     <style>
        /* Custom styles to match your existing design */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .hover-card:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .zoom:hover {
            transform: scale(1.02);
            transition: transform 0.2s ease;
        }
        
        .record-item {
            cursor: pointer;
            margin-bottom: 10px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* .record-title {
            font-size: 15;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
            padding: 0 10px;
        } */
         .record-title {
        font-size: clamp(14px, 2vw, 20px); /* responsive font size */
        white-space: nowrap;               /* prevent breaking into multiple lines */
        overflow: hidden;                  /* hide overflow text */
        text-overflow: ellipsis;           /* add "..." if text is too long */
        max-width: 80%;                    /* keep some space for dropdown button */
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .modal-header, .modal-footer {
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%);
            border: none;
        }
        
        .btn-primary:hover {
            background: linear-gradient(45deg, #5a0db9 0%, #1c68e6 100%);
        }
        
        .btn-light {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .btn-light:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
            box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.25);
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.7);
            grid-column: 1 / span 2;
        }
        
        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        
      .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        
        .floating-btn:hover {
            transform: scale(1.1);
        }

          @media (max-width: 768px) {
            
            .floating-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
                bottom: 15px;
                right: 15px;
            }
        }
    </style>
  </head>
  <body>


     <div class="container-fluid" >

     <!-- Code in main.js for Particles -->
     <div class="particles" id="particles"></div>



     <button class="sg-floating-btn" id="mainBtn">
            <i class="fa-solid fa-bars"></i>
            <i class="fa-solid fa-xmark"></i>
        </button>


        <button class="child-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i>
        </button>
        <button class="child-btn" onclick="window.location.href='theme.html'">
            <i class="fa-brands fa-themeco"></i>
        </button>
        <button type="button" class="child-btn" data-bs-toggle="modal" data-bs-target="#addRecordModal">
            <i class="fas fa-plus"></i>
        </button>
        <a class="child-btn d-none" href="admin.html" id="adminLink"><i class="fas fa-database"></i> </a>
        
        <!-- <button class="child-btn" id="btn5">
            <i class="fas fa-user"></i>
        </button> -->

        <button class="child-btn bg-danger" id="logoutButton" title="logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>




     


<div class="container-fluid mt-3" >

<div class="mb-3">
   <h6><span id="greetingMessage"  style="font-family: Caveat;">Records</span></h6>
</div>
        <!-- Floating Add Button -->
        
            <div class="text-center" id="recordsList">
                <!-- Records will be dynamically added here -->
                <!-- Loading state -->
                <div class="loader"></div>
                
            </div>

    </div>

    <!-- Add Record Modal -->
    <div class="modal fade" id="addRecordModal" tabindex="-1" aria-labelledby="addRecordModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content text-light">
                <div class="modal-header">
                    <h5 class="modal-title" id="addRecordModalLabel">Add New Record</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="recordForm">
                        <div class="mb-3">
                            <label for="recordTitle" class="form-label">Record Title</label>
                            <input type="text" class="form-control" id="recordTitle" placeholder="Enter record title" required>
                        </div>
                        <!-- <div class="mb-3">
                            <label for="recordDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="recordDate" required>
                        </div>
                        <div class="mb-3">
                            <label for="recordAmount" class="form-label">Amount</label>
                            <input type="number" class="form-control" id="recordAmount" placeholder="Enter amount" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label for="recordDescription" class="form-label">Description (Optional)</label>
                            <textarea class="form-control" id="recordDescription" rows="3" placeholder="Enter description"></textarea>
                        </div> -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveRecordBtn">Save Record</button>
                </div>
            </div>
        </div>
    </div>
        

     </div>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="js/firebasecnfig.js"></script>
    <script src="js/main.js" type="module" crossorigin="anonymous"></script>
<script>

        
        let currentUser = null;
        let records = [];

        // Firebase Authentication State Listener
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                
                // Check user role from localStorage
                const userRole = localStorage.getItem("userRole");
                if (userRole === "admin") {
                    document.getElementById("adminLink").classList.remove("d-none");
                }

                // Extract user ID
                const userId = user.uid;

                // Get the first name, fallback to 'User' if displayName is null
                const firstName = user.displayName ? user.displayName.split(' ')[0] : 'User';

                // Update greeting message
                const greetingElement = document.getElementById("greetingMessage");
                if (greetingElement) {
                    greetingElement.innerHTML = `<b>${firstName}</b>, Your Records`;
                }

                // Load user's records
                loadRecords(userId);

                // Update `lastUse` in Firebase Database
                firebase.database().ref(`users/${userId}`).update({
                    lastUse: Date.now(),
                    lastUseFormatted: new Date().toLocaleString()
                });

            } else {
                window.location.href = "login.html";
            }
        });

        // Load records from Firebase
        function loadRecords(userId) {
            const recordsRef = firebase.database().ref(`records/${userId}`);
            
            recordsRef.on('value', (snapshot) => {
                records = [];
                const data = snapshot.val();
                
                if (data) {
                    Object.keys(data).forEach(key => {
                        records.push({
                            key: key,
                            ...data[key]
                        });
                    });
                    
                    // Sort records by date (newest first)
                    records.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    displayRecords();
                } else {
                    displayRecords(); // Show empty state
                }
            });
        }

        // Display records in the grid
        function displayRecords() {
            const recordsList = document.getElementById('recordsList');
            
            if (records.length === 0) {
                recordsList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-file-alt"></i>
                        <h4>No Records Yet</h4>
                        <p>Click the "Add Record" button to create your first record.</p>
                    </div>
                `;
                return;
            }
            
            recordsList.innerHTML = '';
            
            records.forEach(record => {
                const listItem = document.createElement('div');
                listItem.className = 'record-item ';
                listItem.innerHTML = `
                    <div class="glass-card blue shine hover w-100 h-100 d-flex align-items-center justify-content-center position-relative">
                        <div class="record-title fw-bold">
                            <i class="fas fa-file-alt me-2"></i>${record.title}
                        </div>
                        <div class="dropstart position-absolute" style="top: 10px; right: 10px;">
                            <a class="btn btn-sm text-light" href="#" role="button" id="dropdownMenuLink" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-ellipsis-v"></i>  
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="dropdownMenuLink">
                                <li><a class="dropdown-item" href="details-records.html?id=${record.key}">View Details</a></li>
                                <li><a class="dropdown-item" onclick="deleteRecord('${record.key}')">Delete</a></li>
                            </ul>
                        </div>
                    </div>
                `;
                
                // Add click event to navigate to details page when clicking the record
                listItem.addEventListener('click', (e) => {
                    // Prevent navigation if user clicked on the dropdown menu
                    if (!e.target.closest('.dropdown-menu') && !e.target.closest('.dropstart')) {
                        window.location.href = `details-records.html?id=${record.key}`;
                    }
                });
                
                recordsList.appendChild(listItem);
            });
        }

        // Save new record
        document.getElementById('saveRecordBtn').addEventListener('click', () => {
            const title = document.getElementById('recordTitle').value.trim();
            
            if (!title) {
                alert('Please fill in all required fields.');
                return;
            }
            
            if (currentUser) {
                const userId = currentUser.uid;
                const recordsRef = firebase.database().ref(`records/${userId}`);
                
                const newRecord = {
                    title: title,
                    createdAt: Date.now(),
                    createdAtFormatted: new Date().toLocaleString()
                };
                
                recordsRef.push(newRecord)
                    .then(() => {
                        // Reset form and close modal
                        document.getElementById('recordForm').reset();
                        const modalEl = document.getElementById('addRecordModal');
                                    let modal = bootstrap.Modal.getInstance(modalEl);

                                    if (!modal) {
                                        modal = new bootstrap.Modal(modalEl);
                                    }

                                    modal.hide();
                    })
                    .catch(error => {
                        console.error('Error saving record:', error);
                        alert('Error saving record. Please try again.');
                    });
            }
        });

        document.getElementById('addRecordModal')
.addEventListener('hidden.bs.modal', function () {

document.body.classList.remove("modal-open");
document.querySelectorAll(".modal-backdrop").forEach(el => el.remove());

});

        // Delete record and all its transactions
        function deleteRecord(recordKey) {
            if (confirm('Are you sure you want to delete this record? This will also delete all transactions associated with this record.')) {
                if (currentUser) {
                    const userId = currentUser.uid;
                    
                    // First, delete all transactions for this record
                    const transactionsRef = firebase.database().ref(`transactions/${userId}/${recordKey}`);
                    
                    transactionsRef.remove()
                        .then(() => {
                           // console.log('All transactions deleted successfully');
                            
                            // Then delete the record itself
                            const recordRef = firebase.database().ref(`records/${userId}/${recordKey}`);
                            
                            return recordRef.remove();
                        })
                        .then(() => {
                           // console.log('Record deleted successfully');
                        })
                        .catch(error => {
                            console.error('Error deleting record or transactions:', error);
                            alert('Error deleting record. Please try again.');
                        });
                }
            }
        }

     

        // Set today's date as default in the date field
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
        });

    </script>
  </body>
</html>
