          <div class="col-4 col-md-4 mb-5">

          </div>
          <div class="col-4 col-md-4 mb-5">

            <input type="color" class="form-control form-control-color w-100 h-100" id="customColor3" value="#c702f8">

          <div class="col-6 col-md-6 mb-3">

            <select class="form-select" id="customTextStyle">
              <option value="light" selected>🌞 light (text-light)</option>

          </div>

          <div class="col-6 col-md-6 mb-3">

              <option value="light">⚪ light (bg-light, navbar-light)</option>
              <option class="bg-dark text-light" value="dark">⚫ dark (bg-dark, navbar-dark)</option>

          </div>
</div>
          <button class="btn button10 w-100" onclick="applyCustomTheme()">Apply Custom Theme</button>

           Restore Default

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/main.js" type="module" crossorigin="anonymous"></script>

  <script>
    // ---------- THEME DEFINITIONS (presets) ----------
    const themes = [
      { name: "Preset 1", colors: ["#1300c0", "#00b8be", "#c702f8"], text: "light", nav: "theme" },
      { name: "Preset 2", colors: ["#ff512f", "#dd2476", "#ff512f"], text: "light", nav: "theme" },
      { name: "Preset 3", colors: ["#11998e", "#38ef7d", "#11998e"], text: "light", nav: "dark" },
      { name: "Preset 4", colors: ["#00c0c0", "#ff00c8", "#007bff"], text: "light", nav: "theme" }
    ];

    const root = document.documentElement;
    const body = document.body;

    // ---------- APPLY THEME (core) ----------
    function applyTheme(theme) {
      // set css variables
      root.style.setProperty("--color1", theme.colors[0]);
      root.style.setProperty("--color2", theme.colors[1]);
      root.style.setProperty("--color3", theme.colors[2]);

      // text color
      if (theme.text === "light") {
        body.classList.remove("text-dark");
        body.classList.add("text-light");
      } else {
        body.classList.remove("text-light");
        body.classList.add("text-dark");
      }

      // navbar
      const nav = document.querySelector("nav");
      nav.classList.remove("navbar-light", "navbar-dark", "bg-light", "bg-dark", "theme-nav");

      if (theme.nav === "light") {
        nav.classList.add("navbar-light", "bg-light");
      } else if (theme.nav === "dark") {
        nav.classList.add("navbar-dark", "bg-dark");
      } else { // 'theme' or fallback
        nav.classList.add("navbar-dark", "theme-nav");
      }
    }


    window.setTheme = function(index) {

  const theme = themes[index];

  localStorage.setItem("siteTheme", JSON.stringify(theme));

  applyTheme(theme);

  const c1 = document.getElementById('customColor1');
  const c2 = document.getElementById('customColor2');
  const c3 = document.getElementById('customColor3');
  const text = document.getElementById('customTextStyle');
  const nav = document.getElementById('customNavStyle');

  if(c1) c1.value = theme.colors[0];
  if(c2) c2.value = theme.colors[1];
  if(c3) c3.value = theme.colors[2];
  if(text) text.value = theme.text;
  if(nav) nav.value = theme.nav;

};

    // ---------- CUSTOM THEME FROM FORM ----------
    window.applyCustomTheme = function() {
      const color1 = document.getElementById('customColor1').value;
      const color2 = document.getElementById('customColor2').value;
      const color3 = document.getElementById('customColor3').value;
      const textStyle = document.getElementById('customTextStyle').value;
      const navStyle = document.getElementById('customNavStyle').value;

      const customTheme = {
        name: "custom",
        colors: [color1, color2, color3],
        text: textStyle,
        nav: navStyle
      };

      localStorage.setItem("siteTheme", JSON.stringify(customTheme));
      applyTheme(customTheme);
    };

    
   
    function restoreDefaultTheme(){
   localStorage.removeItem("siteTheme");
  location.reload();
}
  </script>

</body>
