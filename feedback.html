<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Note | feedback</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">  
     <!-- My All Type of Style Including Icon [font-awesome/6.0.0-beta3/css/all.min.css] in this style.css -->
    <link href="css/style.css" rel="stylesheet">
<style>
    .star-rating i{
    font-size: 28px;
    color: #ccc;
    cursor: pointer;
    transition: color 0.2s;
}

.star-rating i.selected{
    color: gold;
}
</style>
  </head>
  <body>

      <!-- navbar -->
  <nav class="navbar navbar-expand-lg theme-nav navbar-dark shadow-">
    <div class="container-fluid">
      <a class="navbar-brand button10" href="#" onclick="history.go(-1)"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
      <a class="navbar-brand" href="#">Feedback</a>
    </div>
  </nav>


     <div class="container-fluid" >

     <!-- Code in main.js for Particles -->
     <div class="particles" id="particles"></div>


         <div class="glass-card  p-3 mt-5">
        <h4 class="text-center" style="color: aliceblue;">____ 𒆜 Feedback Form 𒆜 _____</h4>
        <form id="feedbackForm">
            <div class="form-group">
                <label for="feedbackMessage" style="color: aliceblue;">Your Feedback<span class="text-danger">*</span></label>
                <textarea class="form-control" id="feedbackMessage" rows="4" placeholder="Enter your feedback here" required></textarea>
            </div>

            <div class="form-group mt-3">
                <label for="rating" style="color: aliceblue;">Rating (1-5 Stars)<span class="text-danger">*</span></label>
                
                <!-- Star Rating -->
                <div class="star-rating text-center" id="starRating">
                    <i class="fas fa-star " data-value="1"></i>
                    <i class="fas fa-star " data-value="2"></i>
                    <i class="fas fa-star " data-value="3"></i>
                    <i class="fas fa-star " data-value="4"></i>
                    <i class="fas fa-star" data-value="5"></i>
                </div>

                <!-- Star Labels
                <div class="star-labels">
                    <span id="star1Label">Poor</span>
                    <span id="star2Label">Fair</span>
                    <span id="star3Label">Satisfactory</span>
                    <span id="star4Label">Good</span>
                    <span id="star5Label">Outstanding</span>
                </div> -->
            </div>

            <button type="submit" class="btn button12 mt-3 d-block w-100">Submit Feedback</button>
        </form>
    </div>

     </div>


    
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="js/firebasecnfig.js"></script>
    <script src="js/main.js" type="module" crossorigin="anonymous"></script>


    <script>
  

    // Check Authentication State
    firebase.auth().onAuthStateChanged((user) => {
        if (!user) {
            alert("You are not logged in. Redirecting to login page...");
            window.location.href = "login.html";
        }
    });

    // Star Rating Handling
    const stars = document.querySelectorAll('#starRating i');
    let selectedRating = 0;

    stars.forEach(star => {
        star.addEventListener('click', function() {
            selectedRating = this.getAttribute('data-value');
            updateStarSelection(selectedRating);
        });
    });

    function updateStarSelection(rating) {
        stars.forEach(star => {
            if (star.getAttribute('data-value') <= rating) {
                star.classList.add('selected');
            } else {
                star.classList.remove('selected');
            }
        });
    }

    // Feedback Form Submission
    document.getElementById("feedbackForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const feedbackMessage = document.getElementById("feedbackMessage").value;

        if (selectedRating === 0) {
            alert("Please select a rating.");
            return;
        }

        const user = firebase.auth().currentUser;

        if (user) {
            const userId = user.uid;

            // Check if user already has feedback
            const feedbackRef = firebase.database().ref('users/' + userId + '/feedback');
            
            feedbackRef.once('value', (snapshot) => {
                if (snapshot.exists()) {
                    // User has existing feedback, update it
                    const feedbackId = Object.keys(snapshot.val())[0]; // Assuming only one feedback per user
                    feedbackRef.child(feedbackId).update({
                        message: feedbackMessage,
                        rating: selectedRating,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    })
                    .then(() => {
                        alert("Your feedback has been updated!");
                        console.log("Feedback updated successfully!");
                        document.getElementById("feedbackMessage").value = "";  // Clear the form
                        updateStarSelection(0);  // Reset the star rating
                    })
                    .catch((error) => {
                        console.error("Error updating feedback: ", error);
                        alert("Failed to update feedback. Please try again.");
                    });
                } else {
                    // No feedback exists, create a new one
                    const feedbackId = feedbackRef.push().key;
                    feedbackRef.child(feedbackId).set({
                        message: feedbackMessage,
                        rating: selectedRating,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    })
                    .then(() => {
                        alert("Thank you for your feedback!");
                        console.log("Feedback successfully submitted!");
                        document.getElementById("feedbackMessage").value = "";  // Clear the form
                        updateStarSelection(0);  // Reset the star rating
                    })
                    .catch((error) => {
                        console.error("Error submitting feedback: ", error);
                        alert("Failed to submit feedback. Please try again.");
                    });
                }
            });
        } else {
            alert("You must be logged in to submit feedback.");
            console.log("No user is logged in.");
        }
    });


</script>

  </body>
</html>
